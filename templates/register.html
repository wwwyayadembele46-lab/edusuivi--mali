<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Inscription</title></head><body><div class="box"><h2>Inscription {{ "parent" if role=="parent" else "professeur" }}</h2>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="alert">{{m}}</p>{% endfor %}{% endwith %}<form method="post"><input name="name" placeholder="Nom complet" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" required><button class="btn">Créer mon compte</button></form><p><a href="/login">J'ai déjà un compte</a></p></div></body></html>
